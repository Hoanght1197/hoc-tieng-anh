<div id="app">
  <header class="top">
    <button id="back" class="chunky icon-btn" aria-label="Về trang chủ" hidden></button>
    <div class="title" id="title">Bé học tiếng Anh</div>
    <div class="stars" id="starBox" title="Sao bé đã đạt"><svg class="staricon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.6 6.5 20.5l1-6.1L3.1 9.1l6.2-.9z"/></svg> <span id="starCount">0</span></div>
    <button id="gear" class="chunky icon-btn" aria-label="Cài đặt"></button>
  </header>
  <main id="screen"></main>
  <p class="install" id="installTip"></p>
</div>
<div id="dlg" class="dlg" hidden>
  <div class="dlg-box">
    <h3>Cài đặt</h3>
    <div class="set"><span>Giọng tiếng Anh</span><div class="seg" data-k="voice"><button data-v="matilda">Matilda</button><button data-v="emma">Emma</button><button data-v="aria">Aria</button><button data-v="ana">Ana</button></div></div>
    <div class="set"><span>Tốc độ đọc</span><div class="seg" data-k="rate"><button data-v="0.75">Chậm</button><button data-v="0.9">Vừa</button><button data-v="1.05">Nhanh</button></div></div>
    <div class="set"><span>Màu giao diện</span><div class="seg themeseg" data-k="theme"><button data-v="green" style="--sw:#5BA772" aria-label="Xanh lá"></button><button data-v="pink" style="--sw:#F072A6" aria-label="Hồng"></button><button data-v="blue" style="--sw:#4FA5E0" aria-label="Xanh dương"></button><button data-v="purple" style="--sw:#9B77E6" aria-label="Tím"></button><button data-v="orange" style="--sw:#F0A03C" aria-label="Cam"></button></div></div>
    <button class="chunky editprofile" id="editProfile">Đổi tên & bạn đồng hành</button>
    <div class="dlg-actions"><button class="chunky" id="tryVoice">Nghe thử</button><button class="chunky primary" id="closeDlg">Xong</button></div>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
(function () {
  'use strict';

  /* ---------- assets: file rời (index.html) hoặc nhúng sẵn (bundle.html) ---------- */
  const ASSETS = window.ASSETS || null;
  const asset = p => (ASSETS && ASSETS[p]) || p;

  /* ---------- bộ icon SVG (thay emoji cho gọn đẹp) ---------- */
  const _sv = p => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">' + p + '</svg>';
  const ICON = {
    home: _sv('<path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/>'),
    gear: _sv('<path d="M4 7h7M15 7h5"/><circle cx="13" cy="7" r="2.1"/><path d="M4 12h5M13 12h7"/><circle cx="11" cy="12" r="2.1"/><path d="M4 17h9M17 17h3"/><circle cx="15" cy="17" r="2.1"/>'),
    learn: _sv('<path d="M12 6.4C10.4 5 8 4.6 5 5.1v13c3-.5 5.4-.1 7 1.3"/><path d="M12 6.4C13.6 5 16 4.6 19 5.1v13c-3-.5-5.4-.1-7 1.3"/><path d="M12 6.4v13.3"/>'),
    quiz: _sv('<path d="M8.4 8.6a3.6 3.6 0 0 1 7.2 0c0 2.2-1.9 3.1-2.9 4.3-.7.8-.7 1.6-.7 2.4a2 2 0 0 1-4 0"/><path d="M10.5 8.6a1.5 1.5 0 0 1 3 0"/>'),
    speak: _sv('<rect x="9" y="3.4" width="6" height="10.6" rx="3"/><path d="M6.4 11.5a5.6 5.6 0 0 0 11.2 0"/><path d="M12 17.1v3.5M9 20.6h6"/>'),
    memory: _sv('<rect x="4.4" y="7" width="9.4" height="12.4" rx="2.2" transform="rotate(-9 9 13)"/><rect x="10.2" y="5" width="9.4" height="12.4" rx="2.2" transform="rotate(9 15 11)"/>'),
    speaker: _sv('<path d="M4 9.5v5h3.4L12 18V6L7.4 9.5z"/><path d="M15.4 9.6a3.4 3.4 0 0 1 0 4.8"/><path d="M17.6 7.2a6.6 6.6 0 0 1 0 9.6"/>'),
    left: _sv('<path d="M14.5 6 9 12l5.5 6"/>'),
    right: _sv('<path d="M9.5 6 15 12l-5.5 6"/>'),
    replay: _sv('<path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/>'),
    bubble: _sv('<circle cx="10" cy="13" r="6.5"/><circle cx="17" cy="7" r="3"/><path d="M7.5 10.5a2.5 2.5 0 0 1 2-1.5"/>'),
    truefalse: _sv('<path d="M4 12.5l4 4 5-6"/><path d="M14.5 9l6 6M20.5 9l-6 6"/>'),
    yes: _sv('<path d="M5 13l4 4L19 7"/>'),
    no: _sv('<path d="M6 6l12 12M18 6L6 18"/>'),
    play: _sv('<rect x="2.5" y="7.5" width="19" height="10" rx="5"/><path d="M7.5 11v3M6 12.5h3"/><circle cx="15.5" cy="11.8" r="1.1"/><circle cx="18" cy="14" r="1.1"/>'),
    missing: _sv('<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/><path d="M8.8 8.8a1.7 1.7 0 0 1 3.2.6c0 1.1-1.6 1.3-1.6 2.4"/>'),
    count: _sv('<path d="M7 5.5 5 7M7 5.5V17M11 8h9M11 13h9"/>'),
    draw: _sv('<path d="M4 20s1.5-.5 2.5-2.5l8.5-8.5 2.5 2.5-8.5 8.5C7 21 4 20 4 20z"/><path d="M14.5 6.5l3-3 2.5 2.5-3 3"/>'),
    trash: _sv('<path d="M5 7h14M10 7V5h4v2M6.5 7l1 12h9l1-12"/>'),
    fill: _sv('<rect x="3" y="6.5" width="5" height="11" rx="1.6"/><rect x="9.5" y="6.5" width="5" height="11" rx="1.6"/><rect x="16" y="6.5" width="5" height="11" rx="1.6" stroke-dasharray="2.2 2.2"/>')
  };
  ICON.explore = _sv('<circle cx="12" cy="12" r="9"/><path d="M15.6 8.4l-2.1 5.1-5.1 2.1 2.1-5.1z"/>');
  const ic = n => ICON[n] || '';
  const PSTAR = '<svg class="pstar" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.6 6.5 20.5l1-6.1L3.1 9.1l6.2-.9z"/></svg>';

  /* ---------- data ---------- */
  const TOPICS = [
    { id: 'animals', en: 'Animals', vi: 'Động vật', icon: '🐶', cover: 'dog', c: 'var(--animals)', words: [
      ['dog', '🐶', 'con chó'], ['cat', '🐱', 'con mèo'], ['cow', '🐮', 'con bò'], ['pig', '🐷', 'con heo'],
      ['duck', '🦆', 'con vịt'], ['fish', '🐟', 'con cá'], ['bird', '🐦', 'con chim'], ['elephant', '🐘', 'con voi'],
      ['lion', '🦁', 'sư tử'], ['monkey', '🐵', 'con khỉ'], ['rabbit', '🐰', 'con thỏ'], ['frog', '🐸', 'con ếch']] },
    { id: 'fruits', en: 'Fruits', vi: 'Trái cây', icon: '🍎', cover: 'apple', c: 'var(--fruits)', words: [
      ['apple', '🍎', 'quả táo'], ['banana', '🍌', 'quả chuối'], ['orange', '🍊', 'quả cam'], ['grapes', '🍇', 'chùm nho'],
      ['watermelon', '🍉', 'dưa hấu'], ['strawberry', '🍓', 'dâu tây'], ['pineapple', '🍍', 'quả dứa'], ['mango', '🥭', 'quả xoài'],
      ['pear', '🍐', 'quả lê'], ['cherry', '🍒', 'quả anh đào']] },
    { id: 'colors', en: 'Colors', vi: 'Màu sắc', icon: '🎨', c: 'var(--colors)', kind: 'color', words: [
      ['red', '#FF3B30', 'màu đỏ'], ['blue', '#1E7CF5', 'màu xanh dương'], ['yellow', '#FFD60A', 'màu vàng'], ['green', '#34C759', 'màu xanh lá'],
      ['orange', '#FF9500', 'màu cam'], ['purple', '#9B59F5', 'màu tím'], ['pink', '#FF6FB5', 'màu hồng'], ['brown', '#8B5A2B', 'màu nâu'],
      ['black', '#1C1C1E', 'màu đen'], ['white', '#FFFFFF', 'màu trắng']] },
    { id: 'numbers', en: 'Numbers', vi: 'Số đếm', icon: '🔢', c: 'var(--numbers)', kind: 'num', words: [
      ['one', 1, 'số một'], ['two', 2, 'số hai'], ['three', 3, 'số ba'], ['four', 4, 'số bốn'], ['five', 5, 'số năm'],
      ['six', 6, 'số sáu'], ['seven', 7, 'số bảy'], ['eight', 8, 'số tám'], ['nine', 9, 'số chín'], ['ten', 10, 'số mười']] },
    { id: 'body', en: 'My Body', vi: 'Cơ thể', icon: '👋', cover: 'hand', c: 'var(--body)', words: [
      ['eye', '👁️', 'mắt'], ['nose', '👃', 'mũi'], ['mouth', '👄', 'miệng'], ['ear', '👂', 'tai'], ['hand', '✋', 'bàn tay'],
      ['foot', '🦶', 'bàn chân'], ['tooth', '🦷', 'răng'], ['leg', '🦵', 'chân'], ['tongue', '👅', 'lưỡi'], ['arm', '💪', 'cánh tay']] },
    { id: 'family', en: 'Family', vi: 'Gia đình', icon: '👨‍👩‍👧', cover: 'baby', c: 'var(--family)', words: [
      ['mommy', '👩', 'mẹ'], ['daddy', '👨', 'bố'], ['baby', '👶', 'em bé'], ['grandma', '👵', 'bà'], ['grandpa', '👴', 'ông'],
      ['sister', '👧', 'chị / em gái'], ['brother', '👦', 'anh / em trai']] },
    { id: 'vehicles', en: 'Vehicles', vi: 'Xe cộ', icon: '🚗', cover: 'car', c: 'var(--vehicles)', words: [
      ['car', '🚗', 'ô tô'], ['bus', '🚌', 'xe buýt'], ['bike', '🚲', 'xe đạp'], ['train', '🚆', 'tàu hỏa'], ['plane', '✈️', 'máy bay'],
      ['boat', '⛵', 'thuyền'], ['truck', '🚚', 'xe tải'], ['rocket', '🚀', 'tên lửa'], ['motorbike', '🏍️', 'xe máy']] },
    { id: 'things', en: 'Things', vi: 'Đồ vật', icon: '🧸', cover: 'teddy bear', c: 'var(--things)', words: [
      ['ball', '⚽', 'quả bóng'], ['book', '📖', 'quyển sách'], ['hat', '🎩', 'cái mũ'], ['shoes', '👟', 'đôi giày'], ['bed', '🛏️', 'cái giường'],
      ['chair', '🪑', 'cái ghế'], ['clock', '⏰', 'đồng hồ'], ['umbrella', '☂️', 'cái ô'], ['bag', '🎒', 'cái cặp'], ['teddy bear', '🧸', 'gấu bông']] }
  ];
  const fileKey = s => s.replace(/ /g, '_');
  TOPICS.forEach(t => { t.words = t.words.map(w => ({ en: w[0], val: w[1], vi: w[2], kind: t.kind || 'emoji', topic: t.id, key: fileKey(w[0]) })); });

  const PRAISE_N = 8;
  const QUIZ_ROUNDS = 5;
  const MEMORY_PAIRS = 4;

  /* ---------- state ---------- */
  const state = { topic: null, idx: 0, stars: 0, mode: 'learn' };
  try { state.stars = parseInt(localStorage.getItem('bhta_stars') || '0', 10) || 0; } catch (e) {}

  const $ = s => document.querySelector(s);
  const screen = $('#screen'), titleEl = $('#title'), backBtn = $('#back'), starCount = $('#starCount'), starBox = $('#starBox');

  /* ---------- cài đặt (lưu trên máy) ---------- */
  const cfg = { voice: 'matilda', rate: 0.9, theme: 'green' };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem('bhta_cfg') || '{}')); } catch (e) {}
  function saveCfg() { try { localStorage.setItem('bhta_cfg', JSON.stringify(cfg)); } catch (e) {} }
  const VOICE_IDS = ['matilda', 'emma', 'aria', 'ana'];
  if (!VOICE_IDS.includes(cfg.voice)) { cfg.voice = 'matilda'; saveCfg(); }  // giọng cũ đã gỡ -> về mặc định, tránh đọc bằng giọng máy

  /* ---------- hồ sơ bé (tên + bạn đồng hành) ---------- */
  const MASCOTS = ['dog', 'cat', 'rabbit', 'lion', 'monkey', 'frog'];
  const profile = { name: '', mascot: 'dog', setup: false };
  try { Object.assign(profile, JSON.parse(localStorage.getItem('bhta_profile') || '{}')); } catch (e) {}
  function saveProfile() { try { localStorage.setItem('bhta_profile', JSON.stringify(profile)); } catch (e) {} }

  /* ---------- audio: mp3 giọng neural, phát nối tiếp, câu mới luôn cắt câu cũ ---------- */
  const player = new Audio();
  player.preload = 'auto';
  let queue = [], gen = 0, unlocked = false;
  const SILENT = 'data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABJbmZvAAAADwAAAAIAAAGAAICAgICAgICAgICAgICAgICAgICAgICAgICAgP////////////////////////////////8AAAAATGF2YzU4LjEzAAAAAAAAAAAAAAAAJAAAAAAAAAAAAYDOjSGYAAAAAAAAAAAAAAAAAAAA//sQZAAP8AAAaQAAAAgAAA0gAAABAAABpAAAACAAADSAAAAETEFNRTMuMTAwVVVVVVVVVVVVVUxBTUUzLjEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV';
  function unlock() {
    if (unlocked) return; unlocked = true;
    try { player.src = SILENT; player.play().catch(() => {}); } catch (e) {}
    try { if (window.speechSynthesis) speechSynthesis.getVoices(); } catch (e) {}
  }
  document.addEventListener('pointerdown', unlock, { capture: true, once: true });
  document.addEventListener('touchstart', unlock, { capture: true, once: true });

  // Giọng máy của trình duyệt CHỈ dùng khi thiếu hẳn file mp3 (không bao giờ dùng khi bị cắt ngang)
  const hasSpeech = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  function tts(text, lang, done) {
    if (!hasSpeech || !text) { done(); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang; u.rate = 0.85; u.onend = done; u.onerror = done;
      speechSynthesis.speak(u);
      setTimeout(done, 4000);
    } catch (e) { done(); }
  }
  const isVi = c => c.f.indexOf('vi/') === 0;
  const clipSrc = c => asset('audio/' + cfg.voice + '/' + c.f + '.mp3');
  function next(myGen) {
    if (myGen !== gen || !queue.length) return;
    const c = queue.shift();
    let finished = false;
    const done = () => {
      if (finished || myGen !== gen) return;
      finished = true; player.onended = player.onerror = null;
      setTimeout(() => next(myGen), c.gap || 150);
    };
    const fallback = () => { if (myGen !== gen || finished) return; tts(c.t, 'en-US', done); };
    player.onended = done;
    player.onerror = () => { if (player.error && player.error.code === 1) return; fallback(); };
    try {
      player.src = clipSrc(c);
      player.defaultPlaybackRate = cfg.rate; player.playbackRate = cfg.rate;
      const p = player.play();
      if (p && p.catch) p.catch(err => {
        if (myGen !== gen || finished) return;
        const n = err && err.name;
        if (n === 'AbortError' || n === 'NotAllowedError') return; // bị cắt ngang hoặc chưa có thao tác chạm: bỏ qua, không đọc giọng máy
        fallback();
      });
    } catch (e) { fallback(); }
  }
  function say(clips, opts) {
    opts = opts || {};
    gen++;
    const myGen = gen;
    player.onended = player.onerror = null;
    try { player.pause(); } catch (e) {}
    if (hasSpeech) { try { speechSynthesis.cancel(); } catch (e) {} }
    queue = [].concat(clips).filter(Boolean);
    if (!queue.length) return;
    if (opts.delay) setTimeout(() => next(myGen), opts.delay); else next(myGen);
  }
  const clipWord = w => ({ f: 'w_' + w.key, t: w.en });
  const clipFind = w => ({ f: 'find_' + w.key, t: askSpeech(w) });
  const clipThats = w => ({ f: 'thats_' + w.key, t: "That's " + w.en + '.' });
  const clipPraise = () => { const i = Math.floor(Math.random() * PRAISE_N); return { f: 'praise_' + i, t: ['Great job!', 'Well done!', 'Excellent!', 'You did it!', 'Awesome!', 'Super!', 'Wonderful!', 'Yay!'][i] }; };

  /* ---------- sound effects (Web Audio, không cần file) ---------- */
  let actx = null;
  function ac() { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx; }
  // mỗi nốt: { f: tần số, to: trượt tới, d: dài, at: bắt đầu, type, v: to nhỏ }
  function tone(seq) {
    try {
      const a = ac(), t0 = a.currentTime;
      seq.forEach(n => {
        if (Array.isArray(n)) n = { f: n[0], d: n[1], at: n[2] };
        const o = a.createOscillator(), g = a.createGain(), st = t0 + (n.at || 0);
        o.type = n.type || 'triangle';
        o.frequency.setValueAtTime(n.f, st);
        if (n.to) o.frequency.exponentialRampToValueAtTime(n.to, st + n.d);
        g.gain.setValueAtTime(0.0001, st);
        g.gain.exponentialRampToValueAtTime(n.v || 0.2, st + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, st + n.d);
        o.connect(g).connect(a.destination);
        o.start(st); o.stop(st + n.d + 0.05);
      });
    } catch (e) {}
  }
  const bell = (f, at, d, v) => [{ f: f, d: d, at: at, type: 'sine', v: v }, { f: f * 2, d: d * .45, at: at, type: 'sine', v: v * .22 }];
  const sfxTap = () => tone([{ f: 640, to: 300, d: .09, type: 'sine', v: .3 }]);                                   // "pop" bong bóng
  const sfxGood = () => tone(bell(1047, 0, .45, .22).concat(bell(1319, .09, .5, .2), bell(1568, .18, .85, .2)));    // "ting" chuông sáng
  const sfxBad = () => tone([{ f: 330, to: 230, d: .32, type: 'sine', v: .18 }, { f: 165, to: 115, d: .32, type: 'triangle', v: .07 }]); // "boing" mềm
  const sfxWin = () => tone([[523, .16, 0], [659, .16, .13], [784, .16, .26], [1047, .6, .39]].map(x => ({ f: x[0], d: x[1], at: x[2], type: 'triangle', v: .2 })).concat(bell(2093, .42, .9, .12)));
  const sfxSparkle = () => tone([0, 1, 2, 3, 4, 5, 6].map(i => ({ f: 880 * Math.pow(1.19, i), d: .4, at: i * .055, type: 'sine', v: .13 })));

  /* ---------- confetti ---------- */
  const canvas = $('#confetti'), ctx = canvas.getContext('2d');
  let parts = [], raf = null;
  function resize() { canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; }
  addEventListener('resize', resize); resize();
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function confetti(n) {
    if (reduced) return;
    const cols = ['#FF5A3C', '#3FA9F5', '#4CBF63', '#9B6BF2', '#FFC529', '#FF7EB6'];
    const W = canvas.width, H = canvas.height, dpr = devicePixelRatio;
    for (let i = 0; i < (n || 80); i++) {
      parts.push({ x: W / 2 + (Math.random() - .5) * W * .4, y: H * .45, vx: (Math.random() - .5) * 14 * dpr, vy: (-6 - Math.random() * 10) * dpr,
        r: (4 + Math.random() * 5) * dpr, c: cols[i % cols.length], a: Math.random() * Math.PI, va: (Math.random() - .5) * .3, life: 90 + Math.random() * 40 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    parts = parts.filter(p => p.life > 0);
    parts.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += .35 * devicePixelRatio; p.vx *= .99; p.a += p.va; p.life--;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.globalAlpha = Math.min(1, p.life / 30);
      ctx.fillRect(-p.r, -p.r * .6, p.r * 2, p.r * 1.2); ctx.restore();
    });
    if (parts.length) raf = requestAnimationFrame(tick); else { raf = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }

  /* ---------- helpers ---------- */
  function addStars(n) {
    state.stars += n;
    try { localStorage.setItem('bhta_stars', String(state.stars)); } catch (e) {}
    starCount.textContent = state.stars;
    starBox.classList.remove('bump'); void starBox.offsetWidth; starBox.classList.add('bump');
  }

  /* ---------- sticker thưởng: cứ 10 sao mở 1 sticker; tiến độ từng chủ đề ---------- */
  const STICKER_STEP = 10;
  const ALL_STICKERS = []; TOPICS.forEach(t => t.words.forEach(w => { if (w.kind === 'emoji') ALL_STICKERS.push(w); }));
  const album = { got: [], claimed: 0 };
  try { Object.assign(album, JSON.parse(localStorage.getItem('bhta_album') || '{}')); } catch (e) {}
  function saveAlbum() { try { localStorage.setItem('bhta_album', JSON.stringify(album)); } catch (e) {} }
  const stickersDue = () => Math.max(0, Math.min(Math.floor(state.stars / STICKER_STEP) - album.claimed, ALL_STICKERS.length - album.got.length));
  function claimSticker() {
    const left = ALL_STICKERS.filter(w => album.got.indexOf(w.key) < 0);
    if (!left.length || stickersDue() < 1) return null;
    const w = left[Math.floor(Math.random() * left.length)];
    album.got.push(w.key); album.claimed++; saveAlbum(); return w;
  }
  const known = {};
  try { Object.assign(known, JSON.parse(localStorage.getItem('bhta_known') || '{}')); } catch (e) {}
  function markKnown(w) { if (!w) return; const k = w.topic + '/' + w.key; if (known[k]) return; known[k] = 1; try { localStorage.setItem('bhta_known', JSON.stringify(known)); } catch (e) {} }
  const knownCount = t => t.words.filter(w => known[t.id + '/' + w.key]).length;

  /* ---------- speak: app hỏi, bé trả lời bằng tiếng Anh qua micro ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  const ALIASES = {
    dog: ['dog', 'doggy', 'puppy'], cat: ['cat', 'kitty', 'kitten'], pig: ['pig', 'piggy'], duck: ['duck', 'ducky'], rabbit: ['rabbit', 'bunny'],
    bird: ['bird', 'birdie'], mouth: ['mouth', 'lips'], eye: ['eye', 'eyes', 'i'], ear: ['ear', 'ears', 'year'], hand: ['hand', 'hands'],
    foot: ['foot', 'feet'], tooth: ['tooth', 'teeth'], leg: ['leg', 'legs'], arm: ['arm', 'arms'],
    mommy: ['mommy', 'mom', 'mum', 'mummy', 'mama', 'mother'], daddy: ['daddy', 'dad', 'papa', 'father'],
    grandma: ['grandma', 'grandmother', 'granny', 'nana'], grandpa: ['grandpa', 'grandfather', 'granddad', 'grandad'],
    bike: ['bike', 'bicycle'], plane: ['plane', 'airplane', 'aeroplane'], boat: ['boat', 'sailboat', 'ship'], motorbike: ['motorbike', 'motorcycle', 'motor bike'],
    bag: ['bag', 'backpack', 'schoolbag'], hat: ['hat', 'cap'], shoes: ['shoes', 'shoe', 'sneakers'], grapes: ['grapes', 'grape'], cherry: ['cherry', 'cherries'],
    'teddy bear': ['teddy bear', 'teddy', 'bear'], ball: ['ball', 'football', 'soccer ball'],
    one: ['one', '1', 'won'], two: ['two', '2', 'to', 'too'], three: ['three', '3', 'tree', 'free'], four: ['four', '4', 'for'], five: ['five', '5'],
    six: ['six', '6'], seven: ['seven', '7'], eight: ['eight', '8', 'ate'], nine: ['nine', '9'], ten: ['ten', '10'],
    red: ['red', 'read'], blue: ['blue', 'blew'], white: ['white', 'wide'], brown: ['brown', 'braun']
  };
  function lev(a, b) {
    const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, i) => i);
    for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
    return prev[n];
  }
  function heardMatch(w, alts) {
    const cands = ALIASES[w.en] || [w.en];

      const s = a.replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
      const words = s.split(' ');
      return cands.some(c => c.includes(' ') ? s.includes(c) : words.some(x => x === c || (c.length >= 4 && lev(x, c) <= 1)));
    });

    const cur = () => order[round];
    const alive = () => document.body.contains(mic);
    function ask(first) {
      const w = cur(); fails = 0; locked = false;
      $('#prog').innerHTML = order.map((_, i) => '<i class="' + (i < round ? 'on' : '') + '">' + PSTAR + '</i>').join('');

    function advance() { if (!alive()) return; round++; if (round < order.length) ask(); else celebrate(earned + 3, startSpeak); }
    function onHeard(alts) {
      if (!alive() || locked) return;
      const w = cur();

        hint.textContent = 'Đúng rồi! 🎉';
        say([clipWord(w)], { delay: 150 });

          onHeard(alts);
        };
        rec.onerror = e => {
          if (!alive()) return;
          const k = e.error;
          if (k === 'not-allowed' || k === 'service-not-allowed') heard.innerHTML = 'Cần cho phép dùng <b>micro</b> cho trang này.';
          else if (k === 'no-speech') { heard.textContent = 'Chưa nghe thấy gì, bé nói to hơn nhé!'; say([{ f: 'louder', t: "I didn't hear you. Say it louder!" }]); }

        };
        rec.onend = () => { rec = null; mic.classList.remove('listening'); };
        rec.start();
        mic.classList.add('listening'); heard.textContent = 'Đang nghe… 👂'; sfxTap();
      } catch (e) { rec = null; mic.classList.remove('listening'); heard.textContent = 'Không mở được micro.'; }
    }

    ask(true);
  }

      $('#fvis').innerHTML = visual(w);
      $('#tiles').innerHTML = word.split('').map(function (ch, i) {
        return i === hide ? '<span class="tile blank" id="blank">?</span>' : '<span class="tile">' + ch + '</span>';
      }).join('');
      var opts = [ans];
      while (opts.length < 3) { var L = AZ[Math.floor(Math.random() * 26)]; if (opts.indexOf(L) < 0) opts.push(L); }
      opts = shuffle(opts);
      $('#lrow').innerHTML = opts.map(function (L) { return '<button class="chunky letterbtn" data-l="' + L + '">' + L + '</button>'; }).join('');
      say([clipWord(w)], { delay: 350 });
      screen.querySelectorAll('.letterbtn').forEach(function (b) {
        b.addEventListener('click', function () {
          if (locked) return;
          if (b.dataset.l === ans) {
            locked = true; earned++; b.classList.add('right'); sfxGood(); confetti(60); addStars(1); markKnown(w);
            var bl = $('#blank'); bl.textContent = ans; bl.classList.remove('blank'); bl.classList.add('filled');
            say([clipWord(w)], { delay: 150 });
            round++;
            setTimeout(function () { round < order.length ? renderRound() : celebrate(earned + 3, startFill); }, 1500);
          } else { b.classList.add('wrong'); sfxBad(); setTimeout(function () { b.classList.remove('wrong'); }, 500); }
        });
      });
    }
    renderRound();
  }

  /* ---------- celebrate ---------- */
  function celebrate(bonusTotal, replay) {
    addStars(3);
    sfxWin(); confetti(160);
    const st = claimSticker();
    say([{ f: 'hooray', t: 'Hooray! You did it!' }].concat(st ? [clipWord(st)] : []), { delay: 250 });
    if (st) setTimeout(sfxSparkle, 1100);
    screen.innerHTML = '<section class="screen"><div class="party">' +
      '<div class="pmascot">' + mascotImg() + '<i>' + STAR_SVG + '</i></div>' +
      '<h2>Giỏi quá' + (profile.name ? ', ' + esc(profile.name) : '') + '!</h2>' +
      '<div class="earned">+' + bonusTotal + ' <svg class="staricon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.6 6.5 20.5l1-6.1L3.1 9.1l6.2-.9z"/></svg></div>' +
      (st ? '<button class="newst" id="newst">' + visual(st) + '<span class="nst"><small>Sticker mới!</small><b>' + esc(st.en) + '</b></span></button>'
          : '<div class="vi">Còn ' + (STICKER_STEP - state.stars % STICKER_STEP) + ' sao nữa là có sticker mới</div>') +
      '<div class="prow">' +
        '<button class="chunky primary big-btn" id="replay">' + ic('replay') + '<span>Chơi lại</span></button>' +
        '<div class="prow2">' +
          '<button class="chunky" id="learnMore">' + ic('learn') + '<span>Học tiếp</span></button>' +
          '<button class="chunky" id="home">' + ic('home') + '<span>Chủ đề khác</span></button>' +
        '</div>' +
      '</div>' +
      '</div></section>';
    $('#replay').addEventListener('click', () => { sfxTap(); replay(); });
    $('#learnMore').addEventListener('click', () => { sfxTap(); state.mode = 'learn'; renderLearn(); });
    $('#home').addEventListener('click', () => { sfxTap(); renderHome(); });
    const ns = $('#newst'); if (ns) ns.addEventListener('click', () => { sfxTap(); renderAlbum(); });
  }

  /* ---------- PWA: service worker + gợi ý cài lên màn hình chính ---------- */
  (function pwa() {
    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const httpOk = /^https?:$/.test(location.protocol) && !ASSETS;
    if ('serviceWorker' in navigator && httpOk) {
      const hadSW = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').then(reg => {
        // mỗi lần mở app hoặc quay lại app thì kiểm tra bản mới
        const check = () => { try { reg.update(); } catch (e) {} };
        document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
        setTimeout(check, 3000);
      }).catch(() => {});
      // bản mới đã cài xong -> tải lại trang để dùng ngay (chỉ khi trước đó đã có bản cũ, không tải lại ở lần mở đầu)
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hadSW && !reloaded) { reloaded = true; location.reload(); }
      });
    }
    const tip = $('#installTip');
    if (!standalone && isIOS && !localStorage.getItem('bhta_tip')) {
      tip.innerHTML = 'Cài lên iPhone: bấm nút <b>Chia sẻ</b> ⬆️ rồi chọn <b>Thêm vào MH chính</b>. <u>Ẩn</u>';
      tip.classList.add('show');
      tip.addEventListener('click', () => { tip.classList.remove('show'); try { localStorage.setItem('bhta_tip', '1'); } catch (e) {} });
    }
  })();

  /* ---------- settings dialog ---------- */
  const dlg = $('#dlg');
  function renderSettings() {
    dlg.querySelectorAll('.seg').forEach(seg => {
      const k = seg.dataset.k, v = String(cfg[k]);
      seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    });
  }
  dlg.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    const k = b.parentNode.dataset.k, v = b.dataset.v;
    if (k === 'rate') cfg.rate = parseFloat(v); else if (k === 'theme') { cfg.theme = v; applyTheme(v); } else cfg.voice = v;
    saveCfg(); renderSettings(); sfxTap();
  }));
  $('#gear').addEventListener('click', () => { sfxTap(); say([]); renderSettings(); dlg.hidden = false; });
  $('#closeDlg').addEventListener('click', () => { sfxTap(); dlg.hidden = true; });
  $('#editProfile').addEventListener('click', () => { sfxTap(); dlg.hidden = true; renderSetup(); });
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.hidden = true; });
  $('#tryVoice').addEventListener('click', () => say([{ f: 'sample', t: "Hello! I'm your English teacher. Let's learn together!" }]));

  /* ---------- boot ---------- */
  backBtn.addEventListener('click', () => { sfxTap(); say([]); renderHome(); });
  backBtn.innerHTML = ic('home');
  $('#gear').innerHTML = ic('gear');
  starBox.addEventListener('click', () => { sfxTap(); say([]); renderAlbum(); });
  screen.addEventListener('click', e => {
    const f = e.target.closest('.cface'); if (!f) return;
    if (f.classList.contains('still')) sfxTap();
    f.classList.remove('wig'); void f.offsetWidth; f.classList.add('wig');
  });
  $('#tryVoice').innerHTML = ic('speaker') + ' Nghe thử';
  applyTheme(cfg.theme);
  starCount.textContent = state.stars;
  if (!profile.setup) renderSetup(); else renderHome();
})();
</script>
