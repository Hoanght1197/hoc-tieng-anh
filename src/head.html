<title>Bé Học Tiếng Anh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
  :root {
    --bg-top: #D3E4CC; --bg-bot: #A6C6A8; --blob: #BFDAB9;
    --surface: #FFFFFF; --surface-2: #F1F6EF;
    --ink: #33463A; --ink-soft: #728573;
    --line: rgba(51, 70, 58, .12); --shadow: rgba(58, 84, 60, .22);
    --glass: rgba(255, 255, 255, .5);
    --accent: #5BA772; --accent-deep: #3E8C5B;
    --animals: #6DB865; --fruits: #F07A4B; --colors: #9B77E6; --numbers: #4FA5E0;
    --body: #F0A83C; --family: #F080A6; --vehicles: #37BBA4; --things: #EAB43C;
    --grass: #57B368; --grape: #9B77E6; --red: #F0674A;
    --good: #57B368; --bad: #F0674A; --star: #F5B301;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-top: #1E3327; --bg-bot: #12241A; --blob: #24402E;
      --surface: #24382B; --surface-2: #1C2E23;
      --ink: #EAF3E6; --ink-soft: #A6BCA9;
      --line: rgba(234, 243, 230, .14); --shadow: rgba(0, 0, 0, .45);
      --glass: rgba(40, 60, 46, .55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg-top: #1E3327; --bg-bot: #12241A; --blob: #24402E;
    --surface: #24382B; --surface-2: #1C2E23;
    --ink: #EAF3E6; --ink-soft: #A6BCA9;
    --line: rgba(234, 243, 230, .14); --shadow: rgba(0, 0, 0, .45);
    --glass: rgba(40, 60, 46, .55);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%) fixed;
    color: var(--ink); font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; font-weight: 700;
    overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-touch-callout: none;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(circle 200px at 82% 12%, rgba(255,255,255,.4), transparent 70%),
      radial-gradient(circle 240px at 8% 90%, var(--blob), transparent 72%);
    opacity: .85;
  }
  button { font-family: inherit; color: inherit; }
  button:focus-visible { outline: 3px solid var(--accent-deep); outline-offset: 3px; }
  img { pointer-events: none; -webkit-user-drag: none; }

  #app { height: 100vh; height: 100dvh; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column;
    padding: calc(10px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom)); gap: 12px; }

  /* ---------- header ---------- */
  .top { display: grid; grid-template-columns: 52px 1fr auto 52px; align-items: center; gap: 10px; }
  .title { font-family: 'Fredoka', 'Nunito', sans-serif; font-weight: 700; font-size: clamp(19px, 4.6vw, 28px); text-align: center; letter-spacing: .01em; text-wrap: balance; line-height: 1.1; }
  .stars { display: flex; align-items: center; gap: 6px; background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1.5px solid rgba(255,255,255,.5); border-radius: 999px; padding: 7px 15px 7px 11px;
    font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 19px; font-variant-numeric: tabular-nums; min-width: 74px; justify-content: center; color: var(--ink); }
  .stars.bump { animation: pop .4s ease; }

  /* ---------- soft raised buttons ---------- */
  .chunky { border: 0; border-radius: 22px; background: var(--surface); color: var(--ink);
    box-shadow: 0 10px 22px -10px var(--shadow), 0 2px 0 rgba(255,255,255,.55) inset;
    transition: transform .12s ease, box-shadow .12s ease, opacity .2s; cursor: pointer; position: relative; }
  .chunky:active, .chunky.pressed { transform: translateY(2px) scale(.985); box-shadow: 0 5px 12px -8px var(--shadow); }
  .icon-btn { width: 52px; height: 52px; font-size: 24px; border-radius: 17px; display: grid; place-items: center;
    background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1.5px solid rgba(255,255,255,.5); box-shadow: 0 8px 18px -10px var(--shadow); }

  #screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; animation: fadein .3s ease; }

  /* ---------- home ---------- */
  .hero { display: flex; align-items: center; gap: 14px; border-radius: 28px; padding: 14px 18px;
    background: linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,.18)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1.5px solid rgba(255,255,255,.55); box-shadow: 0 16px 30px -16px var(--shadow); }
  .hero .mascot { width: 66px; height: 66px; border-radius: 20px; background: #fff; overflow: hidden; flex: none; box-shadow: 0 8px 16px -8px var(--shadow); }
  .hero .mascot img { width: 100%; height: 100%; object-fit: cover; }
  .hero .htxt { display: flex; flex-direction: column; gap: 2px; }
  .hero .htxt b { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: clamp(19px, 5vw, 24px); }
  .hero .htxt span { color: var(--ink-soft); font-size: 14px; }

  .topics { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-rows: 1fr; gap: 13px; overflow-y: auto; padding: 4px 2px 10px; }
  @media (min-width: 560px) { .topics { grid-template-columns: repeat(4, 1fr); } }
  .topic { --tc: #fff; color: var(--tc); border-radius: 26px; padding: 14px 10px; min-height: 122px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(155deg, rgba(255,255,255,.28), rgba(0,0,0,.10)), var(--c);
    box-shadow: 0 16px 26px -14px var(--c), 0 4px 10px -6px var(--shadow);
    transition: transform .12s ease, box-shadow .12s ease; }
  .topic:active { transform: translateY(3px) scale(.98); box-shadow: 0 8px 16px -12px var(--c); }
  .topic .pic { width: clamp(56px, 14vw, 80px); height: clamp(56px, 14vw, 80px); border-radius: 20px; background: #fff; overflow: hidden; box-shadow: 0 8px 16px -8px rgba(0,0,0,.3); }
  .topic .pic img { border-radius: 0; object-fit: cover; }
  .topic .pic .emoji { font-size: clamp(36px, 8vw, 50px); }
  .t-en { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: clamp(18px, 4.6vw, 23px); text-shadow: 0 2px 4px rgba(0,0,0,.28); }
  .t-vi { font-size: 12.5px; opacity: .95; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.28); }

  /* ---------- learn ---------- */
  .dots { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.55); box-shadow: 0 1px 3px -1px var(--shadow); }
  .dots i.on { background: var(--accent-deep); transform: scale(1.35); }

  .card { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    border-radius: 34px; padding: 14px; width: 100%; background: var(--surface);
    box-shadow: 0 22px 40px -22px var(--shadow), 0 2px 0 rgba(255,255,255,.55) inset; }
  .card .vis { display: grid; place-items: center; flex: 1; min-height: 0; width: 100%; position: relative; }
  .pic { display: grid; place-items: center; }
  .pic img { width: 100%; height: 100%; min-width: 0; min-height: 0; object-fit: contain; border-radius: 24px; }
  .card .pic { position: absolute; inset: 0; margin: auto; max-width: 420px; filter: drop-shadow(0 18px 22px rgba(51,70,58,.22)); }
  .card .pic.bounce, .card .emoji.bounce { animation: bounce .55s cubic-bezier(.34,1.56,.64,1); }
  .emoji { font-size: clamp(110px, 32vmin, 220px); line-height: 1.15; }
  .swatch { width: clamp(120px, 30vmin, 210px); height: clamp(120px, 30vmin, 210px); border-radius: 50%;
    box-shadow: inset 0 -12px 0 rgba(0,0,0,.14), 0 0 0 9px var(--surface), 0 18px 30px -14px var(--shadow); display: block; }
  .num { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .num b { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(90px, 26vmin, 170px); line-height: 1; color: var(--numbers); text-shadow: 0 10px 20px rgba(79,165,224,.3); }
  .num .apples { font-size: clamp(20px, 5vmin, 30px); letter-spacing: 2px; max-width: 300px; text-align: center; line-height: 1.3; }
  .word { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(40px, 11vw, 64px); line-height: 1; color: var(--accent-deep); letter-spacing: .01em; }
  .word.secret { color: var(--line); }
  .vi { color: var(--ink-soft); font-size: clamp(15px, 3.8vw, 19px); }
  .hint { color: var(--ink-soft); font-size: 13px; }

  .nav { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
  .nav .arrow { height: 62px; font-size: 28px; color: var(--accent-deep); }
  .nav .speak { width: 82px; height: 82px; font-size: 38px; border-radius: 50%; background: linear-gradient(150deg, var(--accent), var(--accent-deep)); color: #fff;
    box-shadow: 0 14px 26px -10px var(--accent-deep); }

  /* ---------- bottom nav (modes) ---------- */
  .modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 7px; border-radius: 26px;
    background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1.5px solid rgba(255,255,255,.5); box-shadow: 0 14px 28px -14px var(--shadow); }
  .mode { padding: 8px 4px; font-size: clamp(12px, 3.1vw, 15px); font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: 18px; white-space: nowrap;
    background: transparent; color: var(--ink-soft); box-shadow: none; border: 0; cursor: pointer; transition: transform .12s ease; }
  .mode:active { transform: scale(.94); }
  .mode span { font-size: 21px; }
  .mode.on { background: linear-gradient(150deg, var(--accent), var(--accent-deep)); color: #fff; box-shadow: 0 8px 16px -8px var(--accent-deep); }

  /* ---------- quiz ---------- */
  .ask { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 14px 18px; border-radius: 26px; background: var(--surface);
    box-shadow: 0 16px 30px -18px var(--shadow), 0 2px 0 rgba(255,255,255,.55) inset; }
  .ask .q { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: clamp(22px, 6vw, 32px); text-wrap: balance; text-align: center; }
  .ask .q b { color: var(--accent-deep); }
  .ask .speak { width: 58px; height: 58px; font-size: 26px; border-radius: 50%; background: linear-gradient(150deg, var(--accent), var(--accent-deep)); color: #fff; flex: none; box-shadow: 0 10px 20px -8px var(--accent-deep); }
  .options { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr; grid-auto-rows: 1fr; gap: 12px; }
  @media (min-aspect-ratio: 3/4) { .options { grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; } }
  .opt { display: grid; place-items: center; padding: 10px; border-radius: 28px; min-height: 0; overflow: hidden; background: var(--surface);
    box-shadow: 0 14px 26px -16px var(--shadow), 0 2px 0 rgba(255,255,255,.55) inset; }
  .opt .pic { position: absolute; inset: 8px; margin: auto; max-width: 260px; filter: drop-shadow(0 10px 14px rgba(51,70,58,.2)); }
  .opt .emoji { font-size: clamp(64px, 18vmin, 130px); }
  .opt .swatch { width: clamp(70px, 17vmin, 120px); height: clamp(70px, 17vmin, 120px); }
  .opt .num b { font-size: clamp(60px, 15vmin, 110px); }
  .opt .num .apples { font-size: 16px; }
  .opt.right { background: linear-gradient(150deg, #6FCB7C, var(--good)); animation: pop .45s ease; }
  .opt.wrong { animation: shake .5s ease; opacity: .42; }
  .progress { display: flex; justify-content: center; gap: 8px; font-size: 25px; }
  .progress i { font-style: normal; filter: grayscale(1); opacity: .35; }
  .progress i.on { filter: none; opacity: 1; animation: pop .4s ease; }

  /* ---------- memory ---------- */
  .board { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-rows: 1fr; gap: 11px; perspective: 900px; }
  @media (min-aspect-ratio: 3/4) { .board { grid-template-columns: repeat(4, 1fr); } }
  .mcard { border: 0; background: transparent; padding: 0; position: relative; cursor: pointer; min-height: 0; border-radius: 22px; }
  .mcard .in { position: absolute; inset: 0; transition: transform .45s cubic-bezier(.34,1.3,.64,1); transform-style: preserve-3d; }
  .mcard.up .in { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; border-radius: 22px; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    box-shadow: 0 12px 22px -12px var(--shadow); overflow: hidden; }
  .face.back { background: linear-gradient(150deg, var(--accent), var(--accent-deep));
    background-image: radial-gradient(circle, rgba(255,255,255,.32) 0 7px, transparent 8px); background-size: 26px 26px; color: #fff; font-family: 'Fredoka', sans-serif; font-size: 40px; font-weight: 700; }
  .face.front { background: var(--surface); transform: rotateY(180deg); padding: 6px; }
  .face .pic { position: absolute; inset: 6px; }
  .face .pic img { border-radius: 14px; }
  .face .emoji { font-size: clamp(38px, 11vmin, 76px); }
  .face .swatch { width: clamp(44px, 10vmin, 70px); height: clamp(44px, 10vmin, 70px); box-shadow: inset 0 -6px 0 rgba(0,0,0,.14), 0 0 0 4px var(--line); }
  .face .num b { font-size: clamp(40px, 11vmin, 76px); }
  .face .num .apples { display: none; }
  .mcard.done .face.front { background: linear-gradient(150deg, #6FCB7C, var(--good)); }
  .mcard.done { animation: pop .45s ease; }

  /* ---------- speak ---------- */
  .heard { margin: 0; text-align: center; color: var(--ink-soft); font-size: clamp(15px, 4vw, 19px); min-height: 1.4em; }
  .heard b { color: var(--ink); }
  .microw { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  .microw .replay { height: 56px; font-size: 25px; color: var(--accent-deep); }
  .microw .skip { height: 56px; font-size: 15px; font-weight: 800; color: var(--ink-soft); }
  .mic { width: 94px; height: 94px; border-radius: 50%; background: linear-gradient(150deg, var(--accent), var(--accent-deep)); color: #fff; font-size: 42px; box-shadow: 0 14px 26px -10px var(--accent-deep); }
  .mic.listening { background: linear-gradient(150deg, #6FCB7C, var(--good)); animation: pulse 1s ease-in-out infinite; }
  .mic:disabled { opacity: .35; cursor: default; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 14px 26px -10px var(--accent-deep), 0 0 0 0 rgba(87,179,104,.5) } 50% { box-shadow: 0 14px 26px -10px var(--accent-deep), 0 0 0 22px rgba(87,179,104,0) } }

  /* ---------- celebrate ---------- */
  .party { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; }
  .party .big { font-size: clamp(90px, 28vmin, 170px); line-height: 1; animation: bounce .8s cubic-bezier(.34,1.56,.64,1); }
  .party h2 { font-family: 'Fredoka', 'Nunito', sans-serif; font-weight: 700; font-size: clamp(34px, 9vw, 52px); margin: 0; color: var(--accent-deep); }
  .party .earned { font-family: 'Fredoka', sans-serif; font-size: clamp(26px, 7vw, 36px); font-weight: 600; color: var(--star); }
  .party .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
  .party .row .chunky { padding: 14px 22px; font-size: 18px; font-weight: 800; }
  .party .row .primary { background: linear-gradient(150deg, var(--accent), var(--accent-deep)); color: #fff; }

  /* ---------- settings dialog ---------- */
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  .dlg { position: fixed; inset: 0; background: rgba(30,45,32,.5); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 40; padding: 16px; }
  .dlg[hidden] { display: none; }
  .dlg-box { background: var(--surface); color: var(--ink); border-radius: 30px; padding: 20px 18px 16px; width: min(100%, 420px); box-shadow: 0 30px 60px -20px rgba(0,0,0,.4); display: flex; flex-direction: column; gap: 14px; }
  .dlg-box h3 { margin: 0; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 26px; text-align: center; }
  .set { display: flex; flex-direction: column; gap: 6px; }
  .set > span { font-size: 14px; color: var(--ink-soft); }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .seg button { border: 0; border-radius: 15px; padding: 12px 6px; font-weight: 800; font-size: 15px; background: var(--surface-2); color: var(--ink); box-shadow: 0 4px 10px -6px var(--shadow); cursor: pointer; }
  .seg button.on { background: linear-gradient(150deg, var(--accent), var(--accent-deep)); color: #fff; }
  .dlg-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .dlg-actions .chunky { padding: 14px 10px; font-weight: 800; font-size: 16px; }
  .dlg-actions .primary { background: linear-gradient(150deg, var(--accent), var(--accent-deep)); color: #fff; }

  .hello { margin: 0; text-align: center; color: var(--ink-soft); font-size: clamp(15px, 3.6vw, 18px); }
  .install { display: none; margin: 0; text-align: center; color: var(--ink-soft); font-size: 13px; padding: 8px 12px; border-radius: 16px; background: var(--glass); border: 1.5px solid rgba(255,255,255,.5); }
  .install.show { display: block; }

  @keyframes bounce { 0% { transform: scale(.7) } 55% { transform: scale(1.12) } 100% { transform: scale(1) } }
  @keyframes pop { 0% { transform: scale(1) } 40% { transform: scale(1.12) } 100% { transform: scale(1) } }
  @keyframes shake { 0%,100% { transform: translateX(0) } 20% { transform: translateX(-12px) } 40% { transform: translateX(12px) } 60% { transform: translateX(-8px) } 80% { transform: translateX(8px) } }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
